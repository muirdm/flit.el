name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Go build & vet
        run: |
          cd server && go build -o ../flit .
          cd server && go vet ./...

      - uses: purcell/setup-emacs@master
        with:
          version: 30.1

      - name: Byte-compile Elisp
        run: |
          emacs --batch \
            --eval '(setq byte-compile-error-on-warn t)' \
            -L . \
            -f batch-byte-compile flit.el flit-test.el

      - name: Run ERT tests
        run: |
          emacs --version
          which emacs
          FLIT_SERVER_BINARY=${{ github.workspace }}/flit emacs --batch -L . -l flit-test.el -f ert-run-tests-batch-and-exit
